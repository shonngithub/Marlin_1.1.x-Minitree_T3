name: Build Marlin firmware

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "PlatformIO environment to build"
        required: false
        default: mega2560
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.environment || 'mega2560' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        env:
          PIO_ENV: ${{ inputs.environment || 'mega2560' }}
        run: pio run --environment "$PIO_ENV"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marlin-${{ inputs.environment || 'mega2560' }}
          if-no-files-found: error
          path: |
            .pio/build/${{ inputs.environment || 'mega2560' }}/firmware.hex
            .pio/build/${{ inputs.environment || 'mega2560' }}/firmware.elf
